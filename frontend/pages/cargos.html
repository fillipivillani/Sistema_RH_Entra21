<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargos · Sistema RH</title>
  <script>try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('rh-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-title="Cargos">
  <main class="app-content">
    <div class="page-header">
      <div>
        <span class="page-eyebrow">Estrutura</span>
        <h1 class="page-title">Cargos</h1>
        <p class="page-subtitle" id="summary">Carregando...</p>
      </div>
      <button class="btn btn-primary" id="btn-novo"><i class="bi bi-plus-lg"></i> Novo cargo</button>
    </div>

    <div class="panel">
      <form class="toolbar" id="filters" autocomplete="off">
        <div class="input-icon search">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" id="f-busca" placeholder="Buscar por nome ou CBO">
        </div>
        <select class="form-select" id="f-dep" aria-label="Departamento"><option value="">Todos os departamentos</option></select>
        <select class="form-select" id="f-status" aria-label="Status">
          <option value="">Todos os status</option>
          <option value="ativo">Ativos</option>
          <option value="inativo">Inativos</option>
        </select>
        <button type="reset" class="btn btn-ghost ms-auto"><i class="bi bi-x-lg"></i> Limpar</button>
      </form>

      <div class="table-responsive">
        <table class="table table-hover" id="tabela">
          <thead>
            <tr>
              <th>Cargo</th>
              <th>CBO</th>
              <th>Departamento</th>
              <th class="text-center">Funcionários</th>
              <th>Status</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="estado"></div>
      <div class="table-footer">
        <span id="page-info"></span>
        <ul class="pagination" id="pagination"></ul>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modal-cargo" tabindex="-1" aria-labelledby="modal-cargo-title">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content" id="form-cargo" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-cargo-title">Novo cargo</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="editId">
          <div class="row g-3">
            <div class="col-md-7">
              <label class="form-label" for="cargo-nome">Nome do cargo <span class="req">*</span></label>
              <input type="text" class="form-control" id="cargo-nome" name="nome" maxlength="100" required>
              <div class="invalid-feedback">Informe o nome do cargo.</div>
            </div>
            <div class="col-md-5">
              <label class="form-label" for="cargo-dep">Departamento <span class="req">*</span></label>
              <select class="form-select" id="cargo-dep" name="departamentoId" required></select>
              <div class="invalid-feedback">Selecione um departamento.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="cargo-cbo">Código CBO</label>
              <input type="text" class="form-control" id="cargo-cbo" name="cboCodigo" maxlength="10" placeholder="0000-00">
            </div>
            <div class="col-md-8">
              <label class="form-label" for="cargo-cbo-desc">Descrição CBO</label>
              <input type="text" class="form-control" id="cargo-cbo-desc" name="cboDescricao" maxlength="255">
            </div>
            <div class="col-12">
              <label class="form-label" for="cargo-descricao">Descrição / atribuições</label>
              <textarea class="form-control" id="cargo-descricao" name="descricao" rows="3" maxlength="255"></textarea>
            </div>
            <div class="col-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="cargo-ativo" name="ativo" checked>
                <label class="form-check-label" for="cargo-ativo">Cargo ativo</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar"><i class="bi bi-check2"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../components/layout.js"></script>
  <script src="../assets/js/cargos.js"></script>
</body>
</html>
