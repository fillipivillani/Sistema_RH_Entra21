<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recrutamento · Sistema RH</title>
  <script>try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('rh-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-title="Recrutamento">
  <main class="app-content">
    <!-- Visão: lista de vagas -->
    <section id="view-vagas">
      <div class="page-header">
        <div>
          <span class="page-eyebrow">Pessoas</span>
          <h1 class="page-title">Recrutamento</h1>
          <p class="page-subtitle" id="summary">Carregando...</p>
        </div>
        <button class="btn btn-primary" id="btn-nova-vaga"><i class="bi bi-plus-lg"></i> Nova vaga</button>
      </div>

      <div class="panel mb-4">
        <form class="toolbar border-0" id="filters" autocomplete="off">
          <div class="input-icon search">
            <i class="bi bi-search"></i>
            <input type="search" class="form-control" id="f-busca" placeholder="Buscar vaga">
          </div>
          <select class="form-select" id="f-dep" aria-label="Departamento"><option value="">Todos os departamentos</option></select>
          <select class="form-select" id="f-status" aria-label="Status">
            <option value="">Todos os status</option>
            <option value="ABERTA">Abertas</option>
            <option value="PAUSADA">Pausadas</option>
            <option value="FECHADA">Fechadas</option>
          </select>
        </form>
      </div>

      <div class="row g-4" id="grid"></div>
      <div id="estado"></div>
    </section>

    <!-- Visão: kanban da vaga -->
    <section id="view-kanban" hidden>
      <div class="page-header">
        <div>
          <button class="btn btn-ghost btn-sm mb-2 px-0" id="btn-voltar"><i class="bi bi-arrow-left"></i> Todas as vagas</button>
          <h1 class="page-title" id="vaga-titulo"></h1>
          <p class="page-subtitle" id="vaga-sub"></p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-soft" id="btn-editar-vaga"><i class="bi bi-pencil"></i> Editar vaga</button>
          <button class="btn btn-danger-soft" id="btn-excluir-vaga"><i class="bi bi-trash3"></i> Excluir</button>
          <button class="btn btn-primary" id="btn-novo-cand"><i class="bi bi-person-plus"></i> Candidato</button>
        </div>
      </div>
      <div class="kanban" id="kanban"></div>
    </section>
  </main>

  <div class="modal fade" id="modal-vaga" tabindex="-1" aria-labelledby="modal-vaga-title">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content" id="form-vaga" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-vaga-title">Nova vaga</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="editId">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label" for="vaga-titulo-in">Título <span class="req">*</span></label>
              <input type="text" class="form-control" id="vaga-titulo-in" name="titulo" maxlength="120" required>
              <div class="invalid-feedback">Informe o título da vaga.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="vaga-posicoes">Posições</label>
              <input type="number" class="form-control" id="vaga-posicoes" name="numeroPosicoes" min="1" value="1">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="vaga-dep">Departamento <span class="req">*</span></label>
              <select class="form-select" id="vaga-dep" name="departamentoId" required></select>
              <div class="invalid-feedback">Selecione o departamento.</div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="vaga-prioridade">Prioridade</label>
              <select class="form-select" id="vaga-prioridade" name="prioridade">
                <option value="BAIXA">Baixa</option>
                <option value="MEDIA" selected>Média</option>
                <option value="ALTA">Alta</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="vaga-status">Status</label>
              <select class="form-select" id="vaga-status" name="status">
                <option value="ABERTA">Aberta</option>
                <option value="PAUSADA">Pausada</option>
                <option value="FECHADA">Fechada</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="vaga-desc">Descrição</label>
              <textarea class="form-control" id="vaga-desc" name="descricao" rows="4" maxlength="1000"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar-vaga"><i class="bi bi-check2"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modal-cand" tabindex="-1" aria-labelledby="modal-cand-title">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="form-cand" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-cand-title">Novo candidato</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="editId">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="cand-nome">Nome <span class="req">*</span></label>
              <input type="text" class="form-control" id="cand-nome" name="nome" maxlength="150" required>
              <div class="invalid-feedback">Informe o nome.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="cand-email">E-mail</label>
              <input type="email" class="form-control" id="cand-email" name="email" maxlength="150">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="cand-tel">Telefone</label>
              <input type="tel" class="form-control" id="cand-tel" name="telefone">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="cand-origem">Origem</label>
              <select class="form-select" id="cand-origem" name="origem">
                <option value="LinkedIn">LinkedIn</option>
                <option value="Indicação">Indicação</option>
                <option value="Site">Site</option>
                <option value="Outros">Outros</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="cand-etapa">Etapa</label>
              <select class="form-select" id="cand-etapa" name="etapa"></select>
            </div>
            <div class="col-12">
              <label class="form-label d-block">Avaliação</label>
              <div class="star-input" id="star-input">
                <i class="bi bi-star-fill" data-star="1"></i><i class="bi bi-star-fill" data-star="2"></i><i class="bi bi-star-fill" data-star="3"></i><i class="bi bi-star-fill" data-star="4"></i><i class="bi bi-star-fill" data-star="5"></i>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label" for="cand-obs">Observações</label>
              <textarea class="form-control" id="cand-obs" name="observacoes" rows="3" maxlength="500"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger-soft me-auto d-none" id="btn-excluir-cand"><i class="bi bi-trash3"></i> Remover</button>
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar-cand"><i class="bi bi-check2"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../components/layout.js"></script>
  <script src="../assets/js/recrutamento.js"></script>
</body>
</html>
