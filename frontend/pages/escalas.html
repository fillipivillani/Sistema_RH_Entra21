<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escalas · Sistema RH</title>
  <script>try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('rh-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-title="Escalas">
  <main class="app-content">
    <div class="page-header">
      <div>
        <span class="page-eyebrow">Pessoas</span>
        <h1 class="page-title">Escalas de trabalho</h1>
        <p class="page-subtitle" id="summary">Carregando...</p>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-soft" id="btn-associar"><i class="bi bi-person-check"></i> Associar funcionário</button>
        <button class="btn btn-primary" id="btn-nova"><i class="bi bi-plus-lg"></i> Nova escala</button>
      </div>
    </div>

    <div class="row g-4" id="grid"></div>
    <div id="estado"></div>
  </main>

  <div class="modal fade" id="modal-escala" tabindex="-1" aria-labelledby="modal-escala-title">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="form-escala" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-escala-title">Nova escala</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="esc-nome">Nome <span class="req">*</span></label>
            <input type="text" class="form-control" id="esc-nome" name="nome" maxlength="100" placeholder="Ex.: Comercial, 12x36 noturno" required>
            <div class="invalid-feedback">Informe o nome da escala.</div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label" for="esc-inicio">Início <span class="req">*</span></label>
              <input type="time" class="form-control" id="esc-inicio" name="horarioInicio" required>
              <div class="invalid-feedback">Informe o horário.</div>
            </div>
            <div class="col-6">
              <label class="form-label" for="esc-fim">Fim <span class="req">*</span></label>
              <input type="time" class="form-control" id="esc-fim" name="horarioFim" required>
              <div class="invalid-feedback">Informe o horário.</div>
            </div>
            <div class="col-12"><div class="form-text" id="esc-duracao"></div></div>
          </div>
          <div>
            <label class="form-label" for="esc-descricao">Descrição</label>
            <textarea class="form-control" id="esc-descricao" name="descricao" rows="3" maxlength="255"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar-escala"><i class="bi bi-check2"></i> Criar escala</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modal-associar" tabindex="-1" aria-labelledby="modal-associar-title">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="form-associar" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-associar-title">Associar funcionário à escala</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="assoc-escala">Escala <span class="req">*</span></label>
            <select class="form-select" id="assoc-escala" name="escalaId" required></select>
            <div class="invalid-feedback">Selecione uma escala.</div>
          </div>
          <div>
            <label class="form-label" for="assoc-func">Funcionário <span class="req">*</span></label>
            <select class="form-select" id="assoc-func" name="funcionarioId" required></select>
            <div class="invalid-feedback">Selecione um funcionário.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar-assoc"><i class="bi bi-link-45deg"></i> Associar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../components/layout.js"></script>
  <script src="../assets/js/escalas.js"></script>
</body>
</html>
