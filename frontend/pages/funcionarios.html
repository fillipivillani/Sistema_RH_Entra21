<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funcionários · Sistema RH</title>
  <script>try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('rh-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-title="Funcionários">
  <main class="app-content">
    <div class="page-header">
      <div>
        <span class="page-eyebrow">Pessoas</span>
        <h1 class="page-title">Funcionários</h1>
        <p class="page-subtitle" id="summary">Carregando...</p>
      </div>
      <a href="funcionario-form.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Novo funcionário</a>
    </div>

    <div class="panel">
      <form class="toolbar" id="filters" autocomplete="off">
        <div class="input-icon search">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" id="f-busca" placeholder="Buscar por nome, CPF ou e-mail">
        </div>
        <select class="form-select" id="f-dep" aria-label="Departamento"><option value="">Todos os departamentos</option></select>
        <select class="form-select" id="f-cargo" aria-label="Cargo"><option value="">Todos os cargos</option></select>
        <select class="form-select" id="f-status" aria-label="Status">
          <option value="">Todos os status</option>
          <option value="ativo">Ativos</option>
          <option value="inativo">Inativos</option>
        </select>
        <button type="reset" class="btn btn-ghost ms-auto"><i class="bi bi-x-lg"></i> Limpar</button>
      </form>

      <div class="table-responsive">
        <table class="table table-hover" id="tabela">
          <thead>
            <tr>
              <th class="sortable" data-sort="nome">Funcionário <i class="bi bi-arrow-down-up"></i></th>
              <th class="d-none d-xxl-table-cell">CPF</th>
              <th class="sortable" data-sort="cargo">Cargo / Departamento <i class="bi bi-arrow-down-up"></i></th>
              <th class="sortable" data-sort="dataAdmissao">Admissão <i class="bi bi-arrow-down-up"></i></th>
              <th class="sortable text-end" data-sort="salario">Salário <i class="bi bi-arrow-down-up"></i></th>
              <th>Status</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="estado"></div>
      <div class="table-footer">
        <span id="page-info"></span>
        <ul class="pagination" id="pagination"></ul>
      </div>
    </div>
  </main>

  <!-- Detalhes do funcionário -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="detalhe" style="width:min(460px,100vw);background:var(--surface);color:var(--text)">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold">Detalhes do funcionário</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
    </div>
    <div class="offcanvas-body p-0" id="detalhe-body"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../components/layout.js"></script>
  <script src="../assets/js/funcionarios.js"></script>
</body>
</html>
