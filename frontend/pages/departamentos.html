<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Departamentos · Sistema RH</title>
  <script>try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('rh-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-title="Departamentos">
  <main class="app-content">
    <div class="page-header">
      <div>
        <span class="page-eyebrow">Estrutura</span>
        <h1 class="page-title">Departamentos</h1>
        <p class="page-subtitle" id="summary">Carregando...</p>
      </div>
      <button class="btn btn-primary" id="btn-novo"><i class="bi bi-plus-lg"></i> Novo departamento</button>
    </div>

    <div class="panel mb-4">
      <form class="toolbar border-0" id="filters" autocomplete="off">
        <div class="input-icon search">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" id="f-busca" placeholder="Buscar departamento">
        </div>
        <select class="form-select" id="f-status" aria-label="Status">
          <option value="">Todos os status</option>
          <option value="ativo">Ativos</option>
          <option value="inativo">Inativos</option>
        </select>
      </form>
    </div>

    <div class="row g-4" id="grid"></div>
    <div id="estado"></div>
  </main>

  <div class="modal fade" id="modal-dep" tabindex="-1" aria-labelledby="modal-dep-title">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="form-dep" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-dep-title">Novo departamento</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="editId">
          <div class="mb-3">
            <label class="form-label" for="dep-nome">Nome <span class="req">*</span></label>
            <input type="text" class="form-control" id="dep-nome" name="nome" maxlength="100" required>
            <div class="invalid-feedback">Informe o nome do departamento.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="dep-descricao">Descrição</label>
            <textarea class="form-control" id="dep-descricao" name="descricao" rows="3" maxlength="255"></textarea>
            <div class="form-text text-end"><span id="dep-count">0</span>/255</div>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="dep-ativo" name="ativo" checked>
            <label class="form-check-label" for="dep-ativo">Departamento ativo</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-salvar"><i class="bi bi-check2"></i> Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../components/layout.js"></script>
  <script src="../assets/js/departamentos.js"></script>
</body>
</html>
